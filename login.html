<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Landing Page - Food Order</title>

    	<style>
	
        	/* General Styles */
        	body 
		{
			background: url('Images/index_back1.jpg') no-repeat center/cover;
            		margin: 0;
            		font-family: Arial, sans-serif;
            		text-align: center;
			height:850px;
        	}

        	/* Header */
        	header 
		{
            		padding-bottom:15px;
			padding-top:20px;
            		color:white;
        	}

		.link
		{	
			text-align:right;
			margin-right:40px;
		}

        	/*Hero Section*/ 
        	.hero 
		{
            		display: flex;
            		align-items: center;
            		justify-content: left;
			height:500px;
			color:white;
        	}

        	.order-btn 
		{
            		background-color: #ffcc00;
            		color: black;
			margin-top:20px;
			margin-left:12px;
            		padding: 12px 24px;
            		border: none;
            		cursor: pointer;
            		font-size: 1.2rem;
            		border-radius: 5px;
            		transition: 0.3s;
        	}

        	.order-btn:hover 
		{
            		background-color: #ff9900;
        	}

		section {
      padding-bottom:200px;
      display: flex;
      justify-content: space-between;
    }
    .left-section {
      width: 150%;
    }
    .right-section {
      width: 80%;
    }
    form {
      max-width: 400px;
      margin: auto;
      padding:20px;
      border: 1px solid #ddd;
      border-radius: 10px;
	background-color: adb5bd;
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
    }
    button[type="submit"] {
      padding: 10px 20px;
      background-color: #ffcc00;
      color: black;
      border: none;
      cursor: pointer;
    }
    
		footer 
		{
			background-color: #222;
			color: white;
			padding: 10px;
			text-align:center;
			
		}
    	</style>
</head>

<body>

 	<!-- Header -->
    	<header>
		<div class="link">
			<nav>
            			<a href="index.html" style="text-decoration:none; color:white; text-align:right; margin-right:20px;">Back To Page</a>
            			<a href="signup.html" style="text-decoration:none; color:white; text-align:right; margin-right:20px;">Create An Account</a>
        		</nav>
		</div>

        	<p style="display:block; font-family:Lucida Handwriting; font-size:50px;">Hungerbaz</p>
		
	</header>

    	<section class="hero">
		<p style="font-size:40px; font-family:Copperplate; width:400px; align:left; text-shadow:4px 4px 8px black;">Order food from favourite restaurants near you.
		</p>
		<section>
    <div class="left-section">
      <h2 style= "width:400px; align:left; text-shadow:8px 8px 8px black;">Welcome Back!</h2>
      <p style="text-shadow:8px 8px 8px black;">Please login to your account to order your favorite meals.</p>
    </div>
    <div class="right-section">
      <form onsubmit="return validateLogin()">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter your username">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
        <button type="submit">Login</button>
      </form>
    </div>
  </section>
	</section>

	
    	<!-- Footer -->
    	<footer>	
        	&copy; 2025 Hungerbaz. All rights reserved.
    	</footer>

    	<script>
	
		function validateLogin() {
      var username = document.getElementById("username").value;
      var password = document.getElementById("password").value;
      if (username === "" || password === "") {
        alert("Please fill in both fields!");
        return false;
      } else {
        alert("Login successful! Welcome, " + username + "!");
        return true;
      }
    }
        	
    	</script>

</body>
</html>
