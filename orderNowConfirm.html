<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Confirmation - Hungerbaz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8f8f8;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    margin-bottom: 20px;
  }
  th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
  }
  th {
    background-color: #eee;
  }
  .address-form {
    max-width: 600px;
    margin: 0 auto 20px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
  }
  .address-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .address-form input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .confirm-btn {
    display: block;
    width: 200px;
    margin: 0 auto;
    padding: 12px;
    font-size: 16px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .confirm-btn:hover {
    background-color: #218838;
  }
</style>
</head>
<body>

<h1>Order Confirmation</h1>

<table id="order-table">
  <thead>
    <tr>
      <th>Item Name</th>
      <th>Quantity</th>
      <th>Total Price</th>
    </tr>
  </thead>
  <tbody>
    <!-- Items will be dynamically inserted here -->
  </tbody>
</table>

<div class="address-form">
  <h3>Delivery Details</h3>
  <form id="order-form">
  <label for="fullName">Full Name:</label>
  <input type="text" id="fullName" placeholder="Enter your full name" required />

  <label for="deliveryAddress">Delivery Address:</label>
  <input type="text" id="deliveryAddress" placeholder="Enter your address" required />

  <label for="phoneNumber">Phone Number:</label>
  <input type="tel" id="phoneNumber" placeholder="Enter your phone number" required />

  <button type="submit" class="confirm-btn">Confirm Order</button>
</form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
      // Check for instant order
      const instantOrder = JSON.parse(localStorage.getItem('instantOrder'));
      
      // Redirect if no instant order exists
      if (!instantOrder || instantOrder.length === 0) {
          alert('No items to order! Redirecting to home...');
          window.location.href = 'home.html';
          return;
      }
  
      // Populate order table
      const tbody = document.querySelector('#order-table tbody');
      let totalAmount = 0;
  
      instantOrder.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
              <td>${item.name}</td>
              <td>${item.quantity}</td>
              <td>₹ ${(item.price * item.quantity).toFixed(2)}</td>
          `;
          tbody.appendChild(row);
          totalAmount += item.price * item.quantity;
      });
  
      // Add total row
      const totalRow = document.createElement('tr');
      totalRow.innerHTML = `
          <td colspan="2"><strong>Total</strong></td>
          <td><strong>₹ ${totalAmount.toFixed(2)}</strong></td>
      `;
      tbody.appendChild(totalRow);
  
      // Handle form submission
      document.getElementById('order-form').addEventListener('submit', function(e) {
          e.preventDefault();
  
          // Create order object
          const order = {
              id: Date.now(),
              items: instantOrder,
              total: totalAmount,
              customer: {
                  name: document.getElementById('fullName').value.trim(),
                  address: document.getElementById('deliveryAddress').value.trim(),
                  phone: document.getElementById('phoneNumber').value.trim()
              },
              status: 'Pending',
              date: new Date().toISOString(),
              type: 'instant' // Add order type for tracking
          };
  
          // Input validation
          if (!order.customer.name || !order.customer.address || !order.customer.phone) {
              alert('Please fill in all required fields');
              return;
          }
  
          // Save to order history
          let orders = JSON.parse(localStorage.getItem('orders')) || [];
          orders.push(order);
          localStorage.setItem('orders', JSON.stringify(orders));
  
          // Clear instant order
          localStorage.removeItem('instantOrder');
  
          // Redirect to order details
          window.location.href = `orderDetails1.html?orderId=${order.id}`;
      });
  
      // Prevent form submission on invalid input
      document.getElementById('phoneNumber').addEventListener('input', function(e) {
          this.value = this.value.replace(/[^0-9]/g, '');
      });
  });
  
  // Security check
  if (!localStorage.getItem('instantOrder')) {
      window.location.href = 'home.html';
  }
  </script>

</body>
</html>
