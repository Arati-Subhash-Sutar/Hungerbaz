<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Confirmation - Hungerbaz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8f8f8;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    margin-bottom: 20px;
  }
  th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
  }
  th {
    background-color: #eee;
  }
  .address-form {
    max-width: 600px;
    margin: 0 auto 20px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
  }
  .address-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .address-form input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .confirm-btn {
    display: block;
    width: 200px;
    margin: 0 auto;
    padding: 12px;
    font-size: 16px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .confirm-btn:hover {
    background-color: #218838;
  }
</style>
</head>
<body>

<h1>Order Confirmation</h1>

<table id="order-table">
  <thead>
    <tr>
      <th>Item Name</th>
      <th>Quantity</th>
      <th>Total Price</th>
    </tr>
  </thead>
  <tbody>
    <!-- Items will be dynamically inserted here -->
  </tbody>
</table>

<div class="address-form">
  <h3>Delivery Details</h3>
  <form id="order-form">
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" placeholder="Enter your full name" required />

    <label for="deliveryAddress">Delivery Address:</label>
    <input type="text" id="deliveryAddress" placeholder="Enter your address" required />

    <label for="phoneNumber">Phone Number:</label>
    <input type="tel" id="phoneNumber" placeholder="Enter your phone number" required />

    <button type="submit" class="confirm-btn">Confirm Order</button>
  </form>
</div>

<script>
  // Order Confirmation Functions
  function populateOrderTable() {
      const selectedItems = JSON.parse(localStorage.getItem('selectedCartItems')) || {};
      const tbody = document.querySelector('#order-table tbody');
      tbody.innerHTML = '';
  
      if (Object.keys(selectedItems).length === 0) {
          tbody.innerHTML = `<tr><td colspan="3">No items selected</td></tr>`;
          return;
      }
  
      let grandTotal = 0;
      for (const id in selectedItems) {
          const item = selectedItems[id];
          const totalPrice = item.price * item.quantity;
          grandTotal += totalPrice;
  
          const row = document.createElement('tr');
          row.innerHTML = `
              <td>${item.name}</td>
              <td>${item.quantity}</td>
              <td>₹${totalPrice.toFixed(2)}</td>
          `;
          tbody.appendChild(row);
      }
  
      // Add Grand Total row
      const totalRow = document.createElement('tr');
      totalRow.innerHTML = `
          <td colspan="2"><strong>Grand Total</strong></td>
          <td><strong>₹${grandTotal.toFixed(2)}</strong></td>
      `;
      tbody.appendChild(totalRow);
  }
  
  // Form Submission Handler
  document.getElementById('order-form').addEventListener('submit', function(e) {
      e.preventDefault();
  
      // Get form values
      const fullName = document.getElementById('fullName').value.trim();
      const address = document.getElementById('deliveryAddress').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
  
      if (!fullName || !address || !phone) {
          alert('Please fill in all required fields.');
          return;
      }
  
      // Update main cart
      const selectedItems = JSON.parse(localStorage.getItem('selectedCartItems')) || {};
      let mainCart = JSON.parse(localStorage.getItem('hungerbazCart')) || {};
  
      // Remove ordered items from main cart
      Object.keys(selectedItems).forEach(id => {
          delete mainCart[id];
      });
  
      // Save updates
      localStorage.setItem('hungerbazCart', JSON.stringify(mainCart));
      localStorage.removeItem('selectedCartItems');
  
      alert('Order placed successfully! Thank you for choosing Hungerbaz!');
      window.location.href = 'home.html';
  });
  
  // Initial Load
  document.addEventListener('DOMContentLoaded', populateOrderTable);
  </script>

</body>
</html>
