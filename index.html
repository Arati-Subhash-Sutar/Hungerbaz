<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Landing Page - Food Order</title>

    	<style>
	
        	/* General Styles */
        	body 
		{
			background: url('Images/index_back1.jpg') no-repeat center/cover;
            		margin: 0;
            		font-family: Arial, sans-serif;
            		text-align: center;
			height:850px;
        	}

        	/* Header */
        	header 
		{
            		padding-bottom:15px;
			padding-top:20px;
            		color:white;
        	}

		.link
		{	
			text-decoration:none;
			color:white;
			text-align:right;
			margin-right:40px;
		}

		 nav a:hover {
            color: yellow;
        }

        	/*Hero Section*/ 
        	.hero 
		{
            		display: flex;
            		align-items: center;
            		justify-content: left;
			height:500px;
			color:white;
        	}

       	 .order-btn {  
            background-color: #ffcc00;  
            color: black;  
            padding: 12px 24px;  
            border: none;  
            border-radius: 5px;  
            cursor: pointer;  
            font-size: 1.2rem;  
            transition: 0.3s;  
            margin-top: 20px; 
		margin-left:12px; 
        }  

        .order-btn:hover {  
            background-color: #ff9900;  
        }  


        	/* Contact Section */
        	.contact 
		{
			color:black;
            		background-color: #f4f4f4;
            		padding: 14px;
			text-shadow:1px 1px 18px black;
        	}

		footer 
		{
			background-color: #222;
			color: white;
			padding: 10px;
			text-align:center;
			
		}
    	</style>
</head>

<body>

 	<!-- Header -->
    	<header>
		<div class="link">
			<nav style="hover; color: yellow;">
            			<a href="login.html" style="text-decoration:none; color:white;	text-align:right; margin-right:20px;">Log In</a>
            			<a href="signup.html" style="text-decoration:none; color:white;	text-align:right; margin-right:20px;">Create An Account</a>
        		</nav>
		</div>

        	<p style="display:block; font-family:Lucida Handwriting; font-size:50px;">Hungerbaz</p>
		
	</header>

    	<section class="hero">
		<p style="font-size:40px; font-family:Copperplate; width:400px; align:left; text-shadow:4px 4px 8px black;">Order food from favourite restaurants near you.
		<button class="order-btn">Order Now</button></p>
	</section>

	
    	<!-- Footer -->
    	<footer>

    		<!-- Contact Section -->
    		<section class="contact">
        		<h2>Contact Us</h2>
        		<p>Email: contact@hungerbaz.com</p>
        		<p>Phone: +123 456 7890</p>
    		</section>
	
        	&copy; 2025 Hungerbaz. All rights reserved.
    	</footer>

    	<script>
	
        	 // Add click event for view login page  
        document.querySelectorAll('.order-btn').forEach(button => {  
            button.addEventListener('click', function() {  
                window.location.href = 'signup.html';  
            });  
        });  
    	</script>

</body>
</html>
